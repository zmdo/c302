[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "c302"
dynamic = ["version"]
description = "C. elegans 302 neuron NeuroML 2 network generation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "xlrd",
    "matplotlib",
    "airspeed",
    "lxml",
    "pyyaml",
    "pyNeuroML>=1.3.15",
    "WormNeuroAtlas",
    "cect>=0.3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "coverage>=7"]

[project.scripts]
c302 = "c302.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["c302"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
