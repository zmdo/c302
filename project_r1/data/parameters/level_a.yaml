# Level A 参数集 — 积分放电神经元 + 事件突触
# 最简单层级，所有突触（含电突触）使用 ExpTwoSynapse 模拟

level: A
custom_component_types_definitions: null

parameters:
  # 神经元 IaF 细胞参数
  - name: "neuron_iaf_leak_reversal"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_reset"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_thresh"
    value: "-30mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_C"
    value: "3pF"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_conductance"
    value: "0.1nS"
    source: "BlindGuess"
    certainty: "0.1"

  # 肌肉 IaF 细胞参数（与神经元相同）
  - name: "muscle_iaf_leak_reversal"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_reset"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_thresh"
    value: "-30mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_C"
    value: "3pF"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_conductance"
    value: "0.1nS"
    source: "BlindGuess"
    certainty: "0.1"

  # 兴奋性化学突触
  - name: "neuron_to_neuron_chem_exc_syn_gbase"
    value: "0.01nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_chem_exc_syn_gbase"
    value: "0.01nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "chem_exc_syn_erev"
    value: "0mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "chem_exc_syn_rise"
    value: "3ms"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "chem_exc_syn_decay"
    value: "10ms"
    source: "BlindGuess"
    certainty: "0.1"

  # 抑制性化学突触
  - name: "neuron_to_neuron_chem_inh_syn_gbase"
    value: "0.01nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_chem_inh_syn_gbase"
    value: "0.01nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "chem_inh_syn_erev"
    value: "-80mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "chem_inh_syn_rise"
    value: "3ms"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "chem_inh_syn_decay"
    value: "10ms"
    source: "BlindGuess"
    certainty: "0.1"

  # 电突触（Level A 中用 ExpTwoSynapse 模拟，gbase=0）
  - name: "neuron_to_neuron_elec_syn_gbase"
    value: "0nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_elec_syn_gbase"
    value: "0nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "elec_syn_erev"
    value: "0mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "elec_syn_rise"
    value: "3ms"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "elec_syn_decay"
    value: "10ms"
    source: "BlindGuess"
    certainty: "0.1"

  # 偏置电流
  - name: "unphysiological_offset_current"
    value: "0pA"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_del"
    value: "0ms"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_dur"
    value: "200ms"
    source: "KnownError"
    certainty: "0"
