# Level D1 参数集 — 多室模型 + GradedSynapse2 + GapJunction
# 独立参数集（不使用继承），D1 使用较低内阻和 GradedSynapse2

level: D1
custom_component_types_definitions:
  - "cell_C.xml"
  - "custom_synapses.xml"

parameters:
  # 形态参数
  - name: "cell_diameter"
    value: "5"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_length"
    value: "20"
    source: "BlindGuess"
    certainty: "0.1"

  - name: "initial_memb_pot"
    value: "-45 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "specific_capacitance"
    value: "1 uF_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"

  # 较低胞质电阻率（3 vs D 的 12 kohm_cm）
  - name: "resistivity"
    value: "3 kohm_cm"
    source: "BlindGuess"
    certainty: "0.1"

  # 放电阈值
  - name: "muscle_spike_thresh"
    value: "-26 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_spike_thresh"
    value: "-26 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 漏通道
  - name: "muscle_leak_cond_density"
    value: "0.005 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_leak_cond_density"
    value: "0.005 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "leak_erev"
    value: "-50 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 慢钾通道
  - name: "muscle_k_slow_cond_density"
    value: "4 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_k_slow_cond_density"
    value: "1.8333751019872582 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "k_slow_erev"
    value: "-60 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 快钾通道
  - name: "muscle_k_fast_cond_density"
    value: "0.2 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_k_fast_cond_density"
    value: "0.0711643917483308 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "k_fast_erev"
    value: "-60 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 钙通道
  - name: "muscle_ca_boyle_cond_density"
    value: "4 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_ca_boyle_cond_density"
    value: "1.6862775772264702 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "ca_boyle_erev"
    value: "40 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 钙浓度动力学
  - name: "ca_conc_decay_time"
    value: "11.5943 ms"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "ca_conc_rho"
    value: "0.000238919 mol_per_m_per_A_per_s"
    source: "BlindGuess"
    certainty: "0.1"

  # 全局连接缩放
  - name: "global_connectivity_power_scaling"
    value: "0"
    source: "BlindGuess"
    certainty: "0.1"

  # GradedSynapse2 兴奋性突触
  - name: "neuron_to_neuron_exc_syn_conductance"
    value: "2 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_exc_syn_conductance"
    value: "2 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_ar"
    value: ".5 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_ad"
    value: "20 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_beta"
    value: "0.25 per_mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_vth"
    value: "-35 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_erev"
    value: "0 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # GradedSynapse2 抑制性突触
  - name: "neuron_to_neuron_inh_syn_conductance"
    value: "26 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_inh_syn_conductance"
    value: "0.25 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_ar"
    value: ".005 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_ad"
    value: "10 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_beta"
    value: "0.5 per_mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_vth"
    value: "-55 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_erev"
    value: "-80 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 缝隙连接
  - name: "neuron_to_neuron_elec_syn_gbase"
    value: "0.005 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_elec_syn_gbase"
    value: "0.0001 nS"
    source: "BlindGuess"
    certainty: "0.1"

  # 偏置电流
  - name: "unphysiological_offset_current"
    value: "0 pA"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_del"
    value: "0 ms"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_dur"
    value: "2000 ms"
    source: "KnownError"
    certainty: "0"
