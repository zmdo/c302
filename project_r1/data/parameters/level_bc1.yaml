# Level BC1 参数集 — B 级细胞 + C1 级模拟突触
# 独立参数集（不继承），混合 IafActivityCell 和 GradedSynapse

level: BC1
custom_component_types_definitions: "cell_B.xml"

parameters:
  # 肌肉 IaF 细胞参数
  - name: "muscle_iaf_leak_reversal"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_reset"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_thresh"
    value: "-30mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_C"
    value: "3pF"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_conductance"
    value: "0.1nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_iaf_tau1"
    value: "50ms"
    source: "BlindGuess"
    certainty: "0.1"

  # 神经元 IaF 细胞参数
  - name: "neuron_iaf_leak_reversal"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_reset"
    value: "-50mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_thresh"
    value: "-30mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_C"
    value: "3pF"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_conductance"
    value: "0.1nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_iaf_tau1"
    value: "50ms"
    source: "BlindGuess"
    certainty: "0.1"

  # GradedSynapse 兴奋性突触
  - name: "neuron_to_neuron_exc_syn_conductance"
    value: "8 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_exc_syn_conductance"
    value: "8 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_delta"
    value: "5 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_vth"
    value: "0 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_erev"
    value: "0 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_k"
    value: "0.025per_ms"
    source: "BlindGuess"
    certainty: "0.1"

  # GradedSynapse 抑制性突触
  - name: "neuron_to_neuron_inh_syn_conductance"
    value: "8 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_inh_syn_conductance"
    value: "8 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_delta"
    value: "5 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_vth"
    value: "0 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_erev"
    value: "-70 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_k"
    value: "0.025per_ms"
    source: "BlindGuess"
    certainty: "0.1"

  # 缝隙连接
  - name: "neuron_to_neuron_elec_syn_gbase"
    value: "0.3 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_elec_syn_gbase"
    value: "0.3 nS"
    source: "BlindGuess"
    certainty: "0.1"

  # 偏置电流（注意 BC1 用 nA 单位）
  - name: "unphysiological_offset_current"
    value: "0 nA"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_del"
    value: "0 ms"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_dur"
    value: "2000 ms"
    source: "KnownError"
    certainty: "0"
