# Level C0 参数集 — 简化导电模型 + GradedSynapse2 + GapJunction
# 独立参数集（不使用继承），C0 去掉快钾通道，改用 ca_simple

level: C0
custom_component_types_definitions:
  - "cell_C.xml"
  - "custom_synapses.xml"

parameters:
  # 形态参数
  - name: "cell_diameter"
    value: "5"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "muscle_length"
    value: "20"
    source: "BlindGuess"
    certainty: "0.1"

  # 独立比膜电容
  - name: "muscle_specific_capacitance"
    value: ".6860 uF_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_specific_capacitance"
    value: "5 uF_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"

  - name: "initial_memb_pot"
    value: "-50 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 放电阈值
  - name: "muscle_spike_thresh"
    value: "-20 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_spike_thresh"
    value: "-20 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 漏通道
  - name: "muscle_leak_cond_density"
    value: "0.00105 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_leak_cond_density"
    value: "0.05 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"

  # 慢钾通道（无快钾通道）
  - name: "muscle_k_slow_cond_density"
    value: "0.3 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_k_slow_cond_density"
    value: "0.1 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"

  # 简化钙通道
  - name: "muscle_ca_simple_cond_density"
    value: "0.25 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_ca_simple_cond_density"
    value: "0.06 mS_per_cm2"
    source: "BlindGuess"
    certainty: "0.1"

  # 反转电位
  - name: "leak_erev"
    value: "-44 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "k_slow_erev"
    value: "-80 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "ca_simple_erev"
    value: "50 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 钙浓度动力学
  - name: "ca_conc_decay_time"
    value: "20 ms"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "ca_conc_rho"
    value: "0.0002 mol_per_m_per_A_per_s"
    source: "BlindGuess"
    certainty: "0.1"

  # 全局连接缩放
  - name: "global_connectivity_power_scaling"
    value: "0"
    source: "BlindGuess"
    certainty: "0.1"

  # GradedSynapse2 兴奋性突触
  - name: "neuron_to_neuron_exc_syn_conductance"
    value: "5 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_exc_syn_conductance"
    value: "22.3 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_ar"
    value: ".5 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_ad"
    value: "20 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_beta"
    value: "0.25 per_mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_vth"
    value: "-20 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "exc_syn_erev"
    value: "0 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # GradedSynapse2 抑制性突触
  - name: "neuron_to_neuron_inh_syn_conductance"
    value: "260 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_inh_syn_conductance"
    value: "0.25 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_ar"
    value: ".005 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_ad"
    value: "10 per_s"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_beta"
    value: "0.5 per_mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_vth"
    value: "-25 mV"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "inh_syn_erev"
    value: "-80 mV"
    source: "BlindGuess"
    certainty: "0.1"

  # 缝隙连接
  - name: "neuron_to_neuron_elec_syn_gbase"
    value: "0.05 nS"
    source: "BlindGuess"
    certainty: "0.1"
  - name: "neuron_to_muscle_elec_syn_gbase"
    value: "0.0001 nS"
    source: "BlindGuess"
    certainty: "0.1"

  # 偏置电流
  - name: "unphysiological_offset_current"
    value: "0 pA"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_del"
    value: "0 ms"
    source: "KnownError"
    certainty: "0"
  - name: "unphysiological_offset_current_dur"
    value: "2000 ms"
    source: "KnownError"
    certainty: "0"
